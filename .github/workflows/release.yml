name: Release npm and GitHub
on:
  push:
    branches: [main]
    tags:
      - 'v*'
permissions:
  contents: write
  id-token: write
jobs:
  release:
    if: github.ref_type == 'tag' || (github.ref == 'refs/heads/main' && github.event.head_commit.message == 'chore(release): publish PCC 0.3.2 via OIDC')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - name: Validate tag matches package version
        run: |
          VERSION="$(node -p 'require("./package.json").version')"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            test "v$VERSION" = "$GITHUB_REF_NAME"
          else
            test "$VERSION" = "0.3.2"
          fi
      - name: Pack immutable GitHub Release asset
        run: mkdir -p dist && npm pack --pack-destination dist
      - name: Publish npm with OIDC trusted publishing (skip pre-published initial version)
        run: |
          PKG="$(node -p 'require("./package.json").name')"
          VER="$(node -p 'require("./package.json").version')"
          if npm view "$PKG@$VER" version >/dev/null 2>&1; then
            echo "npm $PKG@$VER is already published"
          else
            npm publish --access public --provenance
          fi
      - name: Publish GitHub Release backup
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$(node -p 'require("./package.json").version')"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.tgz --clobber
          elif [ "$GITHUB_REF_TYPE" = "tag" ]; then
            gh release create "$TAG" dist/*.tgz --generate-notes --verify-tag
          else
            gh release create "$TAG" dist/*.tgz --generate-notes --target "$GITHUB_SHA"
          fi
